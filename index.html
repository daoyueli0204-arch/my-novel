<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>亂書萬藏 • 小說創作館</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { createClient } = supabase;

    // 專屬 Supabase 網址已為你預填
    const DEFAULT_SUPABASE_URL = "https://vrywjinauywqvqsnvgdt.supabase.co";
    // 💡 請在此雙引號中填入你的 Publishable Key (sb_publishable_...)
    const DEFAULT_SUPABASE_ANON_KEY = "sb_publishable_-UwnbY6nQLkejQbzvdWSRA_rqydMjDg"; 

    // 全站三大護眼主題樣式
    const GLOBAL_THEMES = {
      light: {
        id: "light",
        name: "明亮白晝",
        bg: "bg-zinc-50",
        cardBg: "bg-white",
        textMain: "text-zinc-900",
        textSub: "text-zinc-500",
        border: "border-zinc-200",
        inputBg: "bg-white text-zinc-900",
        navBg: "bg-white/90 border-zinc-200",
      },
      cream: {
        id: "cream",
        name: "護眼米黃",
        bg: "bg-[#f5eedc]",
        cardBg: "bg-[#fbf7ee]",
        textMain: "text-[#2d2926]",
        textSub: "text-[#7a6f64]",
        border: "border-[#e3d7bf]",
        inputBg: "bg-[#fbf7ee] text-[#2d2926]",
        navBg: "bg-[#fbf7ee]/95 border-[#e3d7bf]",
      },
      dark: {
        id: "dark",
        name: "深邃黑夜",
        bg: "bg-[#121214]",
        cardBg: "bg-[#1e1e24]",
        textMain: "text-[#e4e4e7]",
        textSub: "text-[#a1a1aa]",
        border: "border-[#2e2e38]",
        inputBg: "bg-[#18181b] text-zinc-100",
        navBg: "bg-[#1e1e24]/95 border-[#2e2e38]",
      }
    };

    const THEME_ACCENTS = {
      indigo: "bg-indigo-700",
      emerald: "bg-emerald-700",
      amber: "bg-amber-700",
      rose: "bg-rose-700",
      slate: "bg-slate-700"
    };

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const paths = {
        book: <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z" />,
        bookOpen: <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />,
        plus: <path d="M12 5v14M5 12h14" />,
        trash: <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />,
        edit: <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />,
        save: <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8" />,
        arrowLeft: <path d="M19 12H5M12 19l-7-7 7-7" />,
        settings: <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />,
        logOut: <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />,
        chevronLeft: <path d="M15 18l-6-6 6-6" />,
        chevronRight: <path d="M9 18l6-6-6-6" />,
        library: <path d="m16 6 4 14M12 6v14M8 8v12M4 4v16" />,
        layers: <><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></>,
        cloud: <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />,
        refresh: <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16M16 21h5v-5" />,
        x: <path d="M18 6 6 18M6 6l12 12" />,
        eye: <><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></>,
        draft: <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8M10 9H8" />,
        rocket: <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09zM12 15l-3-3m5-7.5c2.5-2.5 6-3 6-3s-.5 3.5-3 6c-1.4 1.4-3.5 1.7-5 .5l-1.5 1.5 5 5 1.5-1.5c-1.2-1.5-.9-3.6.5-5z" />
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name] || null}
        </svg>
      );
    };

    function App() {
      const [globalTheme, setGlobalTheme] = useState(() => localStorage.getItem("novel_site_theme") || "light");
      const currentTheme = GLOBAL_THEMES[globalTheme] || GLOBAL_THEMES.light;

      const changeTheme = (th) => {
        setGlobalTheme(th);
        localStorage.setItem("novel_site_theme", th);
      };

      const [sbConfig, setSbConfig] = useState(() => ({
        url: localStorage.getItem("sb_novel_url") || DEFAULT_SUPABASE_URL,
        key: localStorage.getItem("sb_novel_key") || DEFAULT_SUPABASE_ANON_KEY
      }));

      const supabaseClient = useMemo(() => {
        if (sbConfig.url && sbConfig.key) {
          try {
            return createClient(sbConfig.url, sbConfig.key);
          } catch (e) {
            console.error("Supabase 連線失敗", e);
          }
        }
        return null;
      }, [sbConfig]);

      const [library, setLibrary] = useState([]);
      const [draftsList, setDraftsList] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [view, setView] = useState("bookshelf");
      const [currentBookId, setCurrentBookId] = useState("");
      const [currentChapterId, setCurrentChapterId] = useState("");

      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [showConfigModal, setShowConfigModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");
      const [adminTab, setAdminTab] = useState("books");
      const [adminSelectedBookId, setAdminSelectedBookId] = useState("");

      const [bookForm, setBookForm] = useState({ id: "", title: "", author: "王行火華", genre: "玄幻奇幻", status: "連載中", cover_theme: "indigo", description: "" });
      const [isEditingBook, setIsEditingBook] = useState(false);
      const [chapterForm, setChapterForm] = useState({ id: "", title: "", content: "" });
      const [isEditingChapter, setIsEditingChapter] = useState(false);
      const [draftForm, setDraftForm] = useState({ id: "", title: "", content: "" });
      const [isEditingDraft, setIsEditingDraft] = useState(false);

      const [fontSize, setFontSize] = useState(19);
      const [fontFamily, setFontFamily] = useState("serif");

      const fetchCloudData = async () => {
        if (!supabaseClient) return;
        setIsLoading(true);
        try {
          const { data: booksData } = await supabaseClient.from("books").select("*").order("created_at", { ascending: true });
          const { data: chaptersData } = await supabaseClient.from("chapters").select("*").order("created_at", { ascending: true });
          
          let draftsData = [];
          try {
            const res = await supabaseClient.from("drafts").select("*").order("created_at", { ascending: false });
            if (res.data) draftsData = res.data;
          } catch(err) {}

          if (booksData && booksData.length > 0) {
            const assembled = booksData.map((b) => ({
              ...b,
              chapters: (chaptersData || []).filter((c) => c.book_id === b.id)
            }));
            setLibrary(assembled);
            setDraftsList(draftsData || []);
            if (!currentBookId) {
              setCurrentBookId(assembled[0].id);
              setAdminSelectedBookId(assembled[0].id);
            }
          }
        } catch (err) {
          console.error("抓取失敗", err);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        if (supabaseClient) fetchCloudData();
      }, [supabaseClient]);

      const activeBook = useMemo(() => library.find((b) => b.id === currentBookId) || library[0] || null, [library, currentBookId]);
      const activeChapter = useMemo(() => {
        if (!activeBook) return null;
        return activeBook.chapters?.find((c) => c.id === currentChapterId) || activeBook.chapters?.[0] || null;
      }, [activeBook, currentChapterId]);

      const adminActiveBook = useMemo(() => library.find((b) => b.id === adminSelectedBookId) || library[0] || null, [library, adminSelectedBookId]);
      const getWords = (txt = "") => (txt || "").replace(/\s+/g, "").length;

      const currentBookDrafts = useMemo(() => {
        if (!adminActiveBook) return [];
        return draftsList.filter((d) => d.book_id === adminActiveBook.id);
      }, [draftsList, adminActiveBook]);

      const handleSaveBook = async (e) => {
        e.preventDefault();
        if (!bookForm.title.trim()) return alert("請輸入作品名稱！");
        if (supabaseClient) {
          setIsLoading(true);
          await supabaseClient.from("books").upsert({ ...bookForm });
          setIsLoading(false);
          await fetchCloudData();
        }
        setIsEditingBook(false);
      };

      const handleDeleteBook = async (id, title) => {
        if (!confirm(`確定刪除《${title}》嗎？`)) return;
        if (supabaseClient) {
          setIsLoading(true);
          await supabaseClient.from("books").delete().eq("id", id);
          setIsLoading(false);
          await fetchCloudData();
        }
      };

      const handleSaveChapter = async (e) => {
        e.preventDefault();
        if (!chapterForm.title.trim()) return alert("請填寫章節名稱！");
        const payload = { id: chapterForm.id, book_id: adminSelectedBookId, title: chapterForm.title, content: chapterForm.content };
        if (supabaseClient) {
          setIsLoading(true);
          await supabaseClient.from("chapters").upsert(payload);
          setIsLoading(false);
          await fetchCloudData();
        }
        setIsEditingChapter(false);
      };

      const handleDeleteChapter = async (id, title) => {
        if (!confirm(`確定刪除章節「${title}」嗎？`)) return;
        if (supabaseClient) {
          setIsLoading(true);
          await supabaseClient.from("chapters").delete().eq("id", id);
          setIsLoading(false);
          await fetchCloudData();
        }
      };

      const handleSaveDraft = async (e) => {
        e.preventDefault();
        if (!draftForm.title.trim()) return alert("請輸入草稿標題！");
        const payload = { id: draftForm.id, book_id: adminSelectedBookId, title: draftForm.title, content: draftForm.content };
        if (supabaseClient) {
          setIsLoading(true);
          const { error } = await supabaseClient.from("drafts").upsert(payload);
          setIsLoading(false);
          if (error) return alert("草稿儲存失敗，請確認已在 Supabase 執行建立 drafts 資料表的指令！");
          await fetchCloudData();
        }
        setIsEditingDraft(false);
      };

      const handleDeleteDraft = async (id, title) => {
        if (!confirm(`確定捨棄草稿「${title}」嗎？`)) return;
        if (supabaseClient) {
          setIsLoading(true);
          await supabaseClient.from("drafts").delete().eq("id", id);
          setIsLoading(false);
          await fetchCloudData();
        }
      };

      const handlePublishDraftAsChapter = async (draft) => {
        if (!confirm(`確定將草稿「${draft.title}」正式發布為章節嗎？發布後讀者即可看見。`)) return;
        if (supabaseClient) {
          setIsLoading(true);
          const newChap = { id: "chap-" + Date.now(), book_id: draft.book_id, title: draft.title, content: draft.content };
          const { error: cErr } = await supabaseClient.from("chapters").upsert(newChap);
          if (cErr) {
            setIsLoading(false);
            return alert("發布失敗：" + cErr.message);
          }
          await supabaseClient.from("drafts").delete().eq("id", draft.id);
          setIsLoading(false);
          await fetchCloudData();
          alert("🎉 發布成功！草稿已轉為公開章節！");
        }
      };

      const handleSaveConfig = (e) => {
        e.preventDefault();
        localStorage.setItem("sb_novel_url", sbConfig.url.trim());
        localStorage.setItem("sb_novel_key", sbConfig.key.trim());
        setShowConfigModal(false);
        alert("雲端連線已更新！");
      };

      const currentIndex = activeBook?.chapters?.findIndex((c) => c.id === currentChapterId) ?? -1;
      const prevChap = currentIndex > 0 ? activeBook?.chapters[currentIndex - 1] : null;
      const nextChap = currentIndex !== -1 && currentIndex < (activeBook?.chapters?.length || 0) - 1 ? activeBook?.chapters[currentIndex + 1] : null;

      return (
        <div className={`min-h-screen ${currentTheme.bg} ${currentTheme.textMain} font-sans transition-colors duration-200`}>
          <header className={`sticky top-0 z-40 backdrop-blur-md ${currentTheme.navBg} border-b shadow-sm transition-colors`}>
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <button onClick={() => setView("bookshelf")} className="flex items-center gap-2 text-xl font-bold tracking-tight text-indigo-500 hover:opacity-80">
                  <Icon name="library" className="w-6 h-6" />
                  <span>亂書萬藏 • 同人原創連載</span>
                </button>
                <div onClick={() => setShowConfigModal(true)} className={`cursor-pointer hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border ${supabaseClient ? "bg-emerald-500/10 text-emerald-600 border-emerald-500/30" : "bg-amber-500/10 text-amber-600 border-amber-500/30"}`}>
                  <Icon name="cloud" className="w-3.5 h-3.5" />
                  <span>{supabaseClient ? "雲端已連線" : "未連線 (點擊設定)"}</span>
                </div>
              </div>

              <div className="flex items-center gap-2.5">
                <div className={`flex items-center p-1 rounded-xl border ${currentTheme.border} ${currentTheme.cardBg}`}>
                  {Object.values(GLOBAL_THEMES).map((th) => (
                    <button
                      key={th.id}
                      onClick={() => changeTheme(th.id)}
                      className={`px-2 py-0.5 rounded-lg text-xs transition ${
                        globalTheme === th.id
                          ? "bg-indigo-600 text-white font-bold shadow-sm"
                          : `${currentTheme.textSub} hover:opacity-100`
                      }`}
                    >
                      {th.id === "light" ? "☀️ 白晝" : th.id === "cream" ? "🍵 護眼" : "🌙 深夜"}
                    </button>
                  ))}
                </div>

                {isLoading && <Icon name="refresh" className="w-4 h-4 text-indigo-500 animate-spin" />}

                {view === "admin" ? (
                  <button onClick={() => setView("bookshelf")} className={`px-3 py-1.5 text-xs font-medium rounded-xl border ${currentTheme.border} ${currentTheme.cardBg} flex items-center gap-1.5`}>
                    <Icon name="eye" className="w-4 h-4" /> 前台書架
                  </button>
                ) : (
                  <button onClick={() => isAdminLoggedIn ? setView("admin") : setShowPasswordModal(true)} className="px-3.5 py-1.5 text-xs font-semibold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm flex items-center gap-1.5">
                    <Icon name="edit" className="w-4 h-4" /> {isAdminLoggedIn ? "作者工作台" : "作者登入"}
                  </button>
                )}
              </div>
            </div>
          </header>

          {view === "bookshelf" && (
            <main className="max-w-6xl mx-auto px-4 py-10">
              <div className="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <h1 className={`text-3xl font-black mb-1 ${currentTheme.textMain}`}>精選作品書架</h1>
                  <p className={`text-sm ${currentTheme.textSub}`}>點選作品即可閱讀，文章內容由雲端資料庫即時提供。</p>
                </div>
                {supabaseClient && (
                  <button onClick={fetchCloudData} className={`px-3 py-1.5 text-xs rounded-xl border ${currentTheme.border} ${currentTheme.cardBg} flex items-center gap-1.5`}>
                    <Icon name="refresh" className="w-3.5 h-3.5" /> 重新整理
                  </button>
                )}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {library.map((book) => {
                  const accentBg = THEME_ACCENTS[book.cover_theme || "indigo"] || THEME_ACCENTS.indigo;
                  const totalWords = (book.chapters || []).reduce((sum, c) => sum + getWords(c.content), 0);
                  return (
                    <div key={book.id} onClick={() => { setCurrentBookId(book.id); if (book.chapters?.[0]) setCurrentChapterId(book.chapters[0].id); setView("book_detail"); }} className={`group ${currentTheme.cardBg} rounded-2xl border ${currentTheme.border} overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col cursor-pointer transform hover:-translate-y-1`}>
                      <div className={`${accentBg} p-6 text-white h-44 flex flex-col justify-between`}>
                        <div className="flex justify-between items-start">
                          <span className="px-2.5 py-1 text-xs font-semibold rounded-full bg-white/20">{book.genre || "小說"}</span>
                          <span className="text-xs px-2 py-0.5 rounded bg-black/25">{book.status}</span>
                        </div>
                        <div>
                          <h2 className="text-2xl font-bold tracking-tight mb-1 group-hover:underline">{book.title}</h2>
                          <p className="text-xs text-white/80">作者：{book.author}</p>
                        </div>
                      </div>
                      <div className="p-5 flex-1 flex flex-col justify-between">
                        <p className={`text-xs line-clamp-3 mb-4 leading-relaxed ${currentTheme.textSub}`}>{book.description || "暫無簡介"}</p>
                        <div className={`pt-3 border-t ${currentTheme.border} flex items-center justify-between text-xs ${currentTheme.textSub}`}>
                          <span>{book.chapters?.length || 0} 篇章節</span>
                          <span>約 {(totalWords / 10000).toFixed(1)} 萬字</span>
                          <span className="text-indigo-500 font-semibold group-hover:translate-x-1 transition-transform">開始閱讀 →</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>
          )}

          {view === "book_detail" && activeBook && (
            <main className="max-w-4xl mx-auto px-4 py-8">
              <button onClick={() => setView("bookshelf")} className={`inline-flex items-center gap-1.5 text-xs mb-6 ${currentTheme.textSub} hover:opacity-100`}>
                <Icon name="arrowLeft" className="w-4 h-4" /> 返回書架
              </button>
              <div className={`${currentTheme.cardBg} rounded-2xl border ${currentTheme.border} p-6 md:p-8 shadow-sm mb-6 flex flex-col md:flex-row gap-6`}>
                <div className={`w-28 h-40 rounded-lg shadow-md ${THEME_ACCENTS[activeBook.cover_theme || "indigo"]} text-white flex flex-col justify-between p-3 shrink-0`}>
                  <span className="text-[10px] bg-white/20 rounded px-1 self-start">{activeBook.genre}</span>
                  <div className="text-center font-bold text-sm leading-tight">{activeBook.title}</div>
                  <div className="text-[10px] text-right text-white/80">{activeBook.author}</div>
                </div>
                <div className="flex-1">
                  <div className="flex items-center gap-2 mb-2">
                    <h1 className={`text-2xl font-bold ${currentTheme.textMain}`}>{activeBook.title}</h1>
                    <span className="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-500 font-medium">{activeBook.status}</span>
                  </div>
                  <p className={`text-xs mb-4 ${currentTheme.textSub}`}>作者：{activeBook.author} • 共 {activeBook.chapters?.length || 0} 章</p>
                  <p className={`text-xs p-3.5 rounded-xl border ${currentTheme.border} ${currentTheme.inputBg} whitespace-pre-wrap leading-relaxed`}>{activeBook.description}</p>
                  {activeBook.chapters?.length > 0 && (
                    <button onClick={() => { setCurrentChapterId(activeBook.chapters[0].id); setView("reading"); }} className="mt-4 px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl inline-flex items-center gap-2 shadow-sm">
                      <Icon name="bookOpen" className="w-4 h-4" /> 從第一章開始看
                    </button>
                  )}
                </div>
              </div>

              <div className={`${currentTheme.cardBg} rounded-2xl border ${currentTheme.border} p-6 shadow-sm`}>
                <h2 className="text-base font-bold mb-4 flex items-center gap-2">
                  <Icon name="layers" className="w-4 h-4 text-indigo-500" /> 章節目錄清單
                </h2>
                {activeBook.chapters?.length === 0 ? (
                  <div className={`py-8 text-center text-xs ${currentTheme.textSub}`}>本書目前尚無發布章節。</div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">

                        <option value="連載中">連載中</option>
                        <option value="已完結">已完結</option>
                        <option value="籌備中">籌備中</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold mb-1">封面色調</label>
                      <select value={bookForm.cover_theme} onChange={(e) => setBookForm({ ...bookForm, cover_theme: e.target.value })} className={`w-full px-3 py-2 border rounded-xl text-xs ${currentTheme.border} ${currentTheme.inputBg}`}>
                        <option value="indigo">典雅靛藍</option>
                        <option value="emerald">翠林翡翠</option>
                        <option value="amber">秋金琥珀</option>
                        <option value="rose">絳紅烈焰</option>
                        <option value="slate">沉穩玄灰</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold mb-1">作品簡介</label>
                    <textarea rows={4} value={bookForm.description} onChange={(e) => setBookForm({ ...bookForm, description: e.target.value })} className={`w-full px-3 py-2 border rounded-xl text-xs leading-relaxed ${currentTheme.border} ${currentTheme.inputBg}`} />
                  </div>
                </div>
                <div className="flex justify-end gap-2 mt-4">
                  <button type="button" onClick={() => setIsEditingBook(false)} className={`px-3 py-1.5 rounded-lg border ${currentTheme.border}`}>取消</button>
                  <button type="submit" className="px-4 py-1.5 rounded-lg bg-indigo-600 text-white font-bold">儲存作品設定</button>
                </div>
              </form>
            </div>
          )}

          {/* 作者登入彈窗 */}
          {showPasswordModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={(e) => { e.preventDefault(); if (passwordInput === "author888") { setIsAdminLoggedIn(true); setShowPasswordModal(false); setPasswordInput(""); setView("admin"); } else { alert("密碼錯誤！預設通行碼為：author888"); } }} className={`${currentTheme.cardBg} rounded-2xl shadow-xl max-w-sm w-full p-6 text-xs border ${currentTheme.border}`}>
                <h3 className="text-sm font-bold mb-1">進入作者管理後台</h3>
                <p className={`mb-3 ${currentTheme.textSub}`}>預設通行密碼：author888</p>
                <input type="password" autoFocus placeholder="請輸入密碼" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} className={`w-full px-3 py-2 rounded-xl border mb-4 text-sm ${currentTheme.border} ${currentTheme.inputBg}`} />
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={() => setShowPasswordModal(false)} className={`px-3 py-1.5 rounded-lg border ${currentTheme.border}`}>取消</button>
                  <button type="submit" className="px-4 py-1.5 rounded-lg bg-indigo-600 text-white font-bold">確認登入</button>
                </div>
              </form>
            </div>
          )}

          {/* 雲端設定彈窗 */}
          {showConfigModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleSaveConfig} className={`${currentTheme.cardBg} rounded-2xl shadow-xl max-w-md w-full p-6 text-xs border ${currentTheme.border}`}>
                <div className={`flex justify-between items-center mb-3 pb-2 border-b ${currentTheme.border}`}>
                  <h3 className="text-sm font-bold flex items-center gap-1.5">
                    <Icon name="cloud" className="w-4 h-4 text-indigo-500" /> Supabase 雲端資料庫設定
                  </h3>
                  <button type="button" onClick={() => setShowConfigModal(false)} className={currentTheme.textSub}><Icon name="x" className="w-4 h-4" /></button>
                </div>
                <div className="space-y-3 mb-4">
                  <div>
                    <label className="block font-bold mb-1">Project URL</label>
                    <input type="text" value={sbConfig.url} onChange={(e) => setSbConfig({ ...sbConfig, url: e.target.value })} className={`w-full px-3 py-2 border rounded-xl font-mono text-[11px] ${currentTheme.border} ${currentTheme.inputBg}`} />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">Publishable key (anon key)</label>
                    <textarea rows={3} placeholder="sb_publishable_..." value={sbConfig.key} onChange={(e) => setSbConfig({ ...sbConfig, key: e.target.value })} className={`w-full px-3 py-2 border rounded-xl font-mono text-[11px] ${currentTheme.border} ${currentTheme.inputBg}`} />
                  </div>
                </div>
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={() => setShowConfigModal(false)} className={`px-3 py-1.5 rounded-lg border ${currentTheme.border}`}>取消</button>
                  <button type="submit" className="px-4 py-1.5 rounded-lg bg-indigo-600 text-white font-bold">儲存並連線</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
